[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm-pp"
version = "0.1.0"
description = "A minimal, readable LLM inference engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aman Pandey" }]
keywords = ["llm", "inference", "vllm", "paged-attention"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.51",
    "accelerate>=0.20",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn", "pydantic>=2"]
quantization = ["bitsandbytes"]
paged = ["triton>=3.0", "safetensors>=0.4"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/AmanPandey28/nano_vllm_pp"

[tool.ruff.lint.per-file-ignores]
# These are intentionally numbered so a beginner can run the lessons in order.
"nanovllm_pp/tutorials/[0-9]*.py" = ["N999"]

[tool.setuptools.packages.find]
include = ["nanovllm_pp*"]
